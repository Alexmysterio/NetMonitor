# Optional advanced add-ons for NetMonitor.
# Use together with the basic compose file:
#   docker compose -f docker-compose.yml -f docker-compose.advanced.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.advanced.yml --profile backup up -d
#   docker compose -f docker-compose.yml -f docker-compose.advanced.yml --profile agent up -d

services:
  netmonitor:
    ports:
      - "${SNMP_TRAP_PORT:?Set SNMP_TRAP_PORT in .env}:1620/udp"
      - "${SYSLOG_PORT:?Set SYSLOG_PORT in .env}:5514/udp"
      - "${AGENT_MTLS_PORT:?Set AGENT_MTLS_PORT in .env}:8443"
    environment:
      TZ: ${TZ:?Set TZ in .env}
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      POLLER_WORKERS: ${POLLER_WORKERS:?Set POLLER_WORKERS in .env}
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:?Set POLL_INTERVAL_SEC in .env}
      ALERT_MAX_PER_MINUTE: ${ALERT_MAX_PER_MINUTE:?Set ALERT_MAX_PER_MINUTE in .env}
      CORE_LEADER_ELECTION: ${CORE_LEADER_ELECTION:?Set CORE_LEADER_ELECTION in .env}
      AGENT_TLS_ENABLED: ${AGENT_TLS_ENABLED:?Set AGENT_TLS_ENABLED in .env}
      AGENT_TLS_ADDR: ":8443"
      AGENT_TLS_CERT: /app/certs/server.crt
      AGENT_TLS_KEY: /app/certs/server.key
      AGENT_TLS_CA: /app/certs/ca.crt
    volumes:
      - ./deploy/certs:/app/certs:ro
      - ./custom-icons:/usr/share/nginx/html/custom-icons:ro
    sysctls:
      - net.ipv4.ping_group_range=0 2147483647
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  netmonitor-backup:
    image: timescale/timescaledb:latest-pg16
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      netmonitor-db:
        condition: service_healthy
    environment:
      PGHOST: netmonitor-db
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:?Set BACKUP_INTERVAL_HOURS in .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:?Set BACKUP_RETENTION_DAYS in .env}
      BACKUP_VERIFY: ${BACKUP_VERIFY:?Set BACKUP_VERIFY in .env}
    volumes:
      - ./deploy/backup:/scripts:ro
      - ./data/backups:/backups
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    networks:
      - netmonitor-net

  netmonitor-agent:
    image: ghcr.io/alexmysterio/netmonitor:latest
    entrypoint: ["/app/netmonitor-agent"]
    profiles: ["agent"]
    restart: unless-stopped
    cap_add:
      - NET_RAW
    healthcheck:
      disable: true
    environment:
      CORE_WS_URL: ${AGENT_CORE_WS_URL:?Set AGENT_CORE_WS_URL in .env}
      AGENT_TOKEN: ${AGENT_TOKEN}
      AGENT_INSECURE_TLS: ${AGENT_INSECURE_TLS:?Set AGENT_INSECURE_TLS in .env}
      AGENT_TLS_CERT: ${AGENT_TLS_CERT}
      AGENT_TLS_KEY: ${AGENT_TLS_KEY}
      AGENT_TLS_CA: ${AGENT_TLS_CA}
      AGENT_TLS_SERVER_NAME: ${AGENT_TLS_SERVER_NAME:?Set AGENT_TLS_SERVER_NAME in .env}
      AGENT_UPDATE_PUBLIC_KEY: ${AGENT_UPDATE_PUBLIC_KEY}
      TZ: ${TZ:?Set TZ in .env}
    volumes:
      - ./deploy/certs:/app/certs:ro
    networks:
      - netmonitor-net
