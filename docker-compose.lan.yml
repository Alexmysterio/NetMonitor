# Optional LAN/VPN attachment for NetMonitor.
# Use this overlay when the container must reach private networks through a
# dedicated interface, for example a macvlan on 10.240.1.0/24.
#
# Create the external network once on the Docker host:
#   docker network create -d macvlan \
#     --subnet=10.240.1.0/24 \
#     --gateway=10.240.1.1 \
#     -o parent=eth0 netmonitor-lan
#
# Then start the stack with:
#   docker compose -f docker-compose.yml -f docker-compose.lan.yml up -d
#
# Set LAN_NETWORK and LAN_IPV4 in .env. PRIVATE_ROUTE_GATEWAY must point to the
# gateway of that network (10.240.1.1 in this example).

services:
  netmonitor:
    networks:
      # Keep Docker's bridge as the default gateway (Internet, DNS, DB/Redis).
      netmonitor-net:
        gw_priority: 100
      # The LAN/VPN network is only used by the explicit private routes.
      netmonitor-lan:
        ipv4_address: ${LAN_IPV4:?Set LAN_IPV4 in .env}
        gw_priority: 0

networks:
  netmonitor-lan:
    external: true
    name: ${LAN_NETWORK:?Set LAN_NETWORK in .env}
