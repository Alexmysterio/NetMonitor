# Optional: attach NetMonitor to an existing LAN/VPN network so the private
# routes can use that network's gateway.
#
# The container gets its address from the external network; no fixed IP is
# required, so it works with any subnet or DHCP-assigned address. Use a real
# macvlan/ipvlan on the physical NIC, never a bridge with the same subnet as
# the LAN: a bridge would hide the real devices from the container. If the
# Docker host already routes to the LAN, do not use this overlay at all.
#
# 1. Set the network name in .env:
#      LAN_NETWORK=netmonitor-lan
#      PRIVATE_ROUTE_GATEWAY=<gateway-of-that-network>
#
# 2. Start the stack with this overlay:
#      docker compose -f docker-compose.yml -f docker-compose.lan.yml up -d
#
# If Unraid or your own compose already attaches the VLAN/macvlan network to
# the container, you do not need this overlay; just set PRIVATE_ROUTE_* in .env.

services:
  netmonitor:
    networks:
      # Keep Docker's bridge as the default gateway (Internet, DNS, DB/Redis).
      netmonitor-net:
        gw_priority: 100
      # The LAN/VPN network is only used by the explicit private routes.
      netmonitor-lan:
        gw_priority: 0

networks:
  netmonitor-lan:
    external: true
    name: ${LAN_NETWORK:?Set LAN_NETWORK in .env}
