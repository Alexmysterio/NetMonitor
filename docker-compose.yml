# NetMonitor basic deployment.
# One application image (API + poller + frontend + nginx), PostgreSQL and Redis.
# Copy .env.example to .env, fill in the secrets and run:
#   docker compose up -d

services:
  netmonitor-db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netmonitor}
      POSTGRES_USER: ${POSTGRES_USER:-netmonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - netmonitor-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netmonitor} -d ${POSTGRES_DB:-netmonitor}"]
      interval: 5s
      timeout: 5s
      retries: 20

  netmonitor-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    networks:
      - netmonitor-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  netmonitor:
    image: ghcr.io/alexmysterio/netmonitor:latest
    restart: unless-stopped
    depends_on:
      netmonitor-db:
        condition: service_healthy
      netmonitor-redis:
        condition: service_healthy
    cap_add:
      - NET_RAW
    sysctls:
      - net.ipv4.ping_group_range=0 2147483647
    environment:
      APP_ENV: production
      TZ: ${TZ:-Europe/Madrid}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-netmonitor}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@netmonitor-db:5432/${POSTGRES_DB:-netmonitor}?sslmode=disable
      REDIS_URL: redis://netmonitor-redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ALLOW_INSECURE_DEFAULTS: ${ALLOW_INSECURE_DEFAULTS:-false}
      SEED_DEMO: ${SEED_DEMO:-true}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      MAP_BACKGROUND_DIR: /app/uploads/map-backgrounds
      NOTIFICATION_SOUND_DIR: /app/uploads/notification-sounds
      REPORT_DIR: /app/reports
      POLLER_WORKERS: ${POLLER_WORKERS:-64}
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-30}
      ALERT_MAX_PER_MINUTE: ${ALERT_MAX_PER_MINUTE:-120}
      CORE_LEADER_ELECTION: ${CORE_LEADER_ELECTION:-false}
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - uploads:/app/uploads
      - reports:/app/reports
    networks:
      - netmonitor-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pgdata:
  redisdata:
  uploads:
  reports:

networks:
  netmonitor-net:
    driver: bridge
