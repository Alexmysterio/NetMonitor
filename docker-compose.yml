# NetMonitor basic deployment.
# One application image (API + poller + frontend + nginx), PostgreSQL and Redis.
# Copy .env.example to .env, fill in the secrets and run:
#   docker compose up -d

services:
  netmonitor-db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - netmonitor-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  netmonitor-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ./data/redis:/data
    networks:
      - netmonitor-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  netmonitor:
    image: ghcr.io/alexmysterio/netmonitor:latest
    restart: unless-stopped
    depends_on:
      netmonitor-db:
        condition: service_healthy
      netmonitor-redis:
        condition: service_healthy
    cap_add:
      - NET_RAW
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@netmonitor-db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}?sslmode=disable
      REDIS_URL: redis://netmonitor-redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SEED_DEMO: ${SEED_DEMO:?Set SEED_DEMO in .env}
    ports:
      - "${HTTP_BIND:?Set HTTP_BIND in .env}:${HTTP_PORT:?Set HTTP_PORT in .env}:80"
    volumes:
      - ./map-backgrounds:/app/uploads/map-backgrounds
      - ./notification-sounds:/app/uploads/notification-sounds
      - ./reports:/app/reports
    networks:
      - netmonitor-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

networks:
  netmonitor-net:
    driver: bridge
